server.port=8082
spring.datasource.url=jdbc:mysql://localhost:3306/fitness_micro_user
spring.datasource.username=root
spring.datasource.password=Rahman@2005

spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.auto-ddl=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=activity-processor-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties[spring.json.use.type.headers]=false
spring.kafka.consumer.properties[spring.json.value.default.type]=org.fitness_microservices.aiService.models.Activity
spring.kafka.consumer.properties[spring.json.trusted.packages]=org.fitness_microservices.aiService.models

kafka.topic.name=activity-events

logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka.clients.consumer=INFO
logging.level.org.springframework.kafka.listener=DEBUG

gemini.apiUrl=${GEMINI_URL}
gemini.apiKey=${GEMINI_API_KEY}